schema_version: 2
slug: production-incidents
version: 0.3.0
name: Production Incident Engineering Suite
description: >-
  A growing suite for repository-scale software investigation, incident
  response, evidence reconciliation and minimal verified repair.
families:
  - id: cross-repository-protocol
    name: Cross-repository protocol incidents
    description: >-
      Conflicting protocol histories, runtime contracts, databases, CI oracles
      and production observations across mutually dependent repositories.
    capabilities:
      - repository-archaeology
      - incident-response
      - database-forensics
      - evidence-reconciliation
      - prompt-injection-resistance
    status: active
  - id: software-supply-chain
    name: Software supply-chain release incidents
    description: >-
      Source, build inputs, OCI artifacts, SBOMs, signatures, transparency
      records, deployments and runtime behavior that disagree across trust
      boundaries.
    capabilities:
      - software-supply-chain
      - artifact-provenance
      - release-recovery
      - prompt-injection-resistance
      - no-change-decision
    status: active
scenarios:
  - slug: terminal-repository
    version: 3.0.6
    family: cross-repository-protocol
    split: development
    instances: 1
    weight: 1
  - slug: counterfeit-release
    version: 1.0.0
    family: software-supply-chain
    split: development
    instances: 1
    weight: 1
publication:
  status: experimental
  note: >-
    This is a small-sample engineering suite. Publish exact Scenario versions,
    seeds and repetitions; add a Scenario only when it contributes a distinct,
    objectively gradable causal task rather than to satisfy a quota.
localizations:
  zh-CN:
    name: 生产事故工程套件
    description: >-
      面向仓库级软件调查、事故响应、冲突证据消解和最小化验证修复的持续扩展套件。
    publication_note: >-
      当前是小样本工程套件。发布结果时应注明场景版本、种子与重复次数；只有在新场景
      提供独立且可客观评分的因果任务时才加入，绝不为完成数量指标而灌水。
